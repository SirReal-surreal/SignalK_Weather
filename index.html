<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal K Weather</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1d2733; --muted: #6b7885;
    --border: #d5dbe1; --accent: #0b6bcb; --ok: #1a7f37; --warn: #b35900; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c; --card: #1a222b; --text: #e6ebf0; --muted: #8b98a5;
      --border: #2d3844; --accent: #4da3ff; --ok: #4cc26b; --warn: #e8a24a; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; gap: 12px; }
  label { display: block; flex: 1; font-size: 13px; color: var(--muted); }
  input { width: 100%; margin-top: 4px; padding: 8px; font: inherit; color: var(--text);
          background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  button { padding: 8px 14px; font: inherit; color: #fff; background: var(--accent);
           border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .status { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
  .status dt { color: var(--muted); }
  .status dd { margin: 0; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  #log { margin: 0; max-height: 180px; overflow: auto; font: 12px/1.5 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Signal K Weather</h1>

  <section>
    <h2>Signal K server</h2>
    <div class="row">
      <label>IP address <input id="host" value="192.168.0.37" autocomplete="off"></label>
      <label style="max-width:110px">Port <input id="port" type="number" value="3000"></label>
    </div>
  </section>

  <section>
    <h2>Authentication</h2>
    <button id="btn-access" type="button">Request access</button>
    <p id="auth-hint" style="margin:10px 0 0;color:var(--muted);font-size:13px"></p>
  </section>

  <section>
    <h2>Status</h2>
    <dl class="status">
      <dt>Access</dt><dd id="st-auth" class="warn">not requested</dd>
      <dt>Location</dt><dd id="st-loc" class="warn">unknown</dd>
      <dt>Weather</dt><dd id="st-wx" class="warn">no data</dd>
      <dt>Signal K</dt><dd id="st-sk" class="warn">disconnected</dd>
    </dl>
  </section>

  <section>
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
'use strict';

const STORE_KEY = 'skWeather.config';
const DEFAULTS = { host: '192.168.0.37', port: 3000 };

const $ = id => document.getElementById(id);

function log(msg) {
  const t = new Date().toLocaleTimeString();
  $('log').textContent = `${t}  ${msg}\n` + $('log').textContent;
}

function loadConfig() {
  try {
    return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(STORE_KEY)) };
  } catch {
    return { ...DEFAULTS };
  }
}

function saveConfig() {
  const cfg = { host: $('host').value.trim() || DEFAULTS.host,
                port: Number($('port').value) || DEFAULTS.port };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch {}
  return cfg;
}

// ---- Authentication (Signal K "request access") ----

const AUTH_KEY = 'skWeather.auth';
const POLL_MS = 3000;
let auth = loadAuth();   // { clientId, token, requestHref }
let pollTimer = null;

function loadAuth() {
  let a = {};
  try { a = JSON.parse(localStorage.getItem(AUTH_KEY)) || {}; } catch {}
  if (!a.clientId) a.clientId = crypto.randomUUID();
  return a;
}

function saveAuth() {
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch {}
}

function baseUrl() {
  const cfg = saveConfig();
  return `http://${cfg.host}:${cfg.port}`;
}

function setAuthStatus(text, cls) {
  $('st-auth').textContent = text;
  $('st-auth').className = cls;
}

function renderAuth() {
  if (auth.token) {
    setAuthStatus('approved (token stored)', 'ok');
    $('auth-hint').textContent = 'Access granted. Request again to replace the token.';
  } else if (auth.requestHref) {
    setAuthStatus('pending - approve in Signal K', 'warn');
    $('auth-hint').textContent = 'Open the Signal K Admin UI > Security > Access Requests and approve with read/write permission.';
  } else {
    setAuthStatus('not requested', 'warn');
    $('auth-hint').textContent = '';
  }
}

async function requestAccess() {
  clearTimeout(pollTimer);
  auth.token = null;
  try {
    const res = await fetch(`${baseUrl()}/signalk/v1/access/requests`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: auth.clientId,
        description: 'Signal K Weather (browser app)',
        permissions: 'readwrite'
      })
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 202 || res.status === 200) {
      auth.requestHref = body.href;
      saveAuth();
      log('Access request sent, waiting for approval');
      renderAuth();
      pollRequest();
    } else {
      throw new Error(`HTTP ${res.status} ${body.message || ''}`);
    }
  } catch (e) {
    auth.requestHref = null;
    saveAuth();
    setAuthStatus('request failed', 'err');
    $('auth-hint').textContent = `${e.message}. Check IP/port and that the server is reachable.`;
    log(`Access request failed: ${e.message}`);
  }
}

async function pollRequest() {
  if (!auth.requestHref) return;
  try {
    const res = await fetch(`${baseUrl()}${auth.requestHref}`);
    const body = await res.json();
    if (body.state === 'COMPLETED') {
      auth.requestHref = null;
      const ar = body.accessRequest || {};
      saveAuth();
      if (ar.permission === 'APPROVED' && ar.token) {
        auth.token = ar.token;
        saveAuth();
        log('Access approved, token stored');
        renderAuth();
      } else {
        setAuthStatus('denied', 'err');
        $('auth-hint').textContent = 'The request was denied in Signal K.';
        log('Access denied');
      }
      return;
    }
  } catch (e) {
    log(`Polling error: ${e.message}`);
  }
  pollTimer = setTimeout(pollRequest, POLL_MS);
}

function init() {
  const cfg = loadConfig();
  $('host').value = cfg.host;
  $('port').value = cfg.port;
  $('host').addEventListener('change', saveConfig);
  $('port').addEventListener('change', saveConfig);
  $('btn-access').addEventListener('click', requestAccess);
  renderAuth();
  if (auth.requestHref) pollRequest();
  log(`Ready. Signal K target: ${cfg.host}:${cfg.port}`);
}

init();
</script>
</body>
</html>
