<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal K Weather</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1d2733; --muted: #6b7885;
    --border: #d5dbe1; --accent: #0b6bcb; --ok: #1a7f37; --warn: #b35900; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c; --card: #1a222b; --text: #e6ebf0; --muted: #8b98a5;
      --border: #2d3844; --accent: #4da3ff; --ok: #4cc26b; --warn: #e8a24a; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; gap: 12px; }
  label { display: block; flex: 1; font-size: 13px; color: var(--muted); }
  input { width: 100%; margin-top: 4px; padding: 8px; font: inherit; color: var(--text);
          background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  button { padding: 8px 14px; font: inherit; color: #fff; background: var(--accent);
           border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .status { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
  .status dt { color: var(--muted); }
  .status dd { margin: 0; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  #log { margin: 0; max-height: 180px; overflow: auto; font: 12px/1.5 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Signal K Weather</h1>

  <section>
    <h2>Signal K server</h2>
    <div class="row">
      <label>IP address <input id="host" value="192.168.0.37" autocomplete="off"></label>
      <label style="max-width:110px">Port <input id="port" type="number" value="3000"></label>
    </div>
  </section>

  <section>
    <h2>Authentication</h2>
    <button id="btn-access" type="button">Request access</button>
    <p id="auth-hint" style="margin:10px 0 0;color:var(--muted);font-size:13px"></p>
  </section>

  <section>
    <h2>Status</h2>
    <dl class="status">
      <dt>Access</dt><dd id="st-auth" class="warn">not requested</dd>
      <dt>Location</dt><dd id="st-loc" class="warn">unknown</dd>
      <dt>Weather</dt><dd id="st-wx" class="warn">no data</dd>
      <dt>Signal K</dt><dd id="st-sk" class="warn">disconnected</dd>
    </dl>
  </section>

  <section>
    <h2>Current weather</h2>
    <dl class="status">
      <dt>Temperature</dt><dd id="wx-temp">-</dd>
      <dt>Wind speed</dt><dd id="wx-speed">-</dd>
      <dt>Wind direction</dt><dd id="wx-dir">-</dd>
      <dt>Pressure</dt><dd id="wx-press">-</dd>
      <dt>Wind gusts</dt><dd id="wx-gust">-</dd>
      <dt>Humidity</dt><dd id="wx-hum">-</dd>
      <dt>Dew point</dt><dd id="wx-dew">-</dd>
      <dt>Position</dt><dd id="wx-pos">-</dd>
      <dt>Updated</dt><dd id="wx-time">-</dd>
    </dl>
  </section>

  <section>
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
'use strict';

const STORE_KEY = 'skWeather.config';
const DEFAULTS = { host: '192.168.0.37', port: 3000 };

const $ = id => document.getElementById(id);

function log(msg) {
  const t = new Date().toLocaleTimeString();
  $('log').textContent = `${t}  ${msg}\n` + $('log').textContent;
}

function loadConfig() {
  try {
    return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(STORE_KEY)) };
  } catch {
    return { ...DEFAULTS };
  }
}

function saveConfig() {
  const cfg = { host: $('host').value.trim() || DEFAULTS.host,
                port: Number($('port').value) || DEFAULTS.port };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch {}
  return cfg;
}

// ---- Authentication (Signal K "request access") ----

const AUTH_KEY = 'skWeather.auth';
const POLL_MS = 3000;
let auth = loadAuth();   // { clientId, token, requestHref }
let pollTimer = null;

function loadAuth() {
  let a = {};
  try { a = JSON.parse(localStorage.getItem(AUTH_KEY)) || {}; } catch {}
  if (!a.clientId) a.clientId = crypto.randomUUID();
  return a;
}

function saveAuth() {
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch {}
}

function baseUrl() {
  const cfg = saveConfig();
  return `http://${cfg.host}:${cfg.port}`;
}

function setAuthStatus(text, cls) {
  $('st-auth').textContent = text;
  $('st-auth').className = cls;
}

function renderAuth() {
  if (auth.token) {
    setAuthStatus('approved (token stored)', 'ok');
    $('auth-hint').textContent = 'Access granted. Request again to replace the token.';
  } else if (auth.requestHref) {
    setAuthStatus('pending - approve in Signal K', 'warn');
    $('auth-hint').textContent = 'Open the Signal K Admin UI > Security > Access Requests and approve with read/write permission.';
  } else {
    setAuthStatus('not requested', 'warn');
    $('auth-hint').textContent = '';
  }
}

async function requestAccess() {
  clearTimeout(pollTimer);
  auth.token = null;
  try {
    const res = await fetch(`${baseUrl()}/signalk/v1/access/requests`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: auth.clientId,
        description: 'Signal K Weather (browser app)',
        permissions: 'readwrite'
      })
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 202 || res.status === 200) {
      auth.requestHref = body.href;
      saveAuth();
      log('Access request sent, waiting for approval');
      renderAuth();
      pollRequest();
    } else {
      throw new Error(`HTTP ${res.status} ${body.message || ''}`);
    }
  } catch (e) {
    auth.requestHref = null;
    saveAuth();
    setAuthStatus('request failed', 'err');
    $('auth-hint').textContent = `${e.message}. Check IP/port and that the server is reachable.`;
    log(`Access request failed: ${e.message}`);
  }
}

async function pollRequest() {
  if (!auth.requestHref) return;
  try {
    const res = await fetch(`${baseUrl()}${auth.requestHref}`);
    const body = await res.json();
    if (body.state === 'COMPLETED') {
      auth.requestHref = null;
      const ar = body.accessRequest || {};
      saveAuth();
      if (ar.permission === 'APPROVED' && ar.token) {
        auth.token = ar.token;
        saveAuth();
        log('Access approved, token stored');
        renderAuth();
      } else {
        setAuthStatus('denied', 'err');
        $('auth-hint').textContent = 'The request was denied in Signal K.';
        log('Access denied');
      }
      return;
    }
  } catch (e) {
    log(`Polling error: ${e.message}`);
  }
  pollTimer = setTimeout(pollRequest, POLL_MS);
}

// ---- Location and weather (Open-Meteo) ----

const WEATHER_MS = 10 * 60 * 1000;
let position = null;   // { lat, lon }
let latest = null;     // Signal K SI values: { temperature, windSpeed, windDirection, pressure, time }

function setStatus(id, text, cls) {
  $(id).textContent = text;
  $(id).className = cls;
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('geolocation not supported'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      e => reject(new Error(e.message || 'location denied')),
      { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
    );
  });
}

// Open-Meteo units: degC, hPa, m/s (requested), degrees -> Signal K SI: K, Pa, m/s, rad
function toSignalK(c) {
  return {
    temperature: c.temperature_2m + 273.15,
    windSpeed: c.wind_speed_10m,
    windDirection: c.wind_direction_10m * Math.PI / 180,
    pressure: c.pressure_msl * 100,
    windGust: c.wind_gusts_10m,
    humidity: c.relative_humidity_2m / 100,
    dewPoint: c.dew_point_2m + 273.15,
    time: new Date()
  };
}

function renderWeather() {
  if (position) {
    $('wx-pos').textContent = `${position.lat.toFixed(4)}, ${position.lon.toFixed(4)}`;
  }
  if (!latest) return;
  $('wx-temp').textContent = `${(latest.temperature - 273.15).toFixed(1)} °C  (${latest.temperature.toFixed(2)} K)`;
  $('wx-speed').textContent = `${latest.windSpeed.toFixed(1)} m/s  (${(latest.windSpeed * 1.94384).toFixed(1)} kn)`;
  $('wx-dir').textContent = `${(latest.windDirection * 180 / Math.PI).toFixed(0)}°  (${latest.windDirection.toFixed(3)} rad)`;
  $('wx-press').textContent = `${(latest.pressure / 100).toFixed(1)} hPa  (${latest.pressure.toFixed(0)} Pa)`;
  $('wx-gust').textContent = `${latest.windGust.toFixed(1)} m/s  (${(latest.windGust * 1.94384).toFixed(1)} kn)`;
  $('wx-hum').textContent = `${(latest.humidity * 100).toFixed(0)} %  (${latest.humidity.toFixed(2)})`;
  $('wx-dew').textContent = `${(latest.dewPoint - 273.15).toFixed(1)} °C  (${latest.dewPoint.toFixed(2)} K)`;
  $('wx-time').textContent = latest.time.toLocaleTimeString();
}

async function updateWeather() {
  try {
    position = await getPosition();
    setStatus('st-loc', 'ok', 'ok');
  } catch (e) {
    setStatus('st-loc', position ? 'using last position' : 'unavailable', position ? 'warn' : 'err');
    log(`Location error: ${e.message}`);
    if (!position) return;
  }
  try {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${position.lat.toFixed(4)}&longitude=${position.lon.toFixed(4)}`
      + '&current=temperature_2m,pressure_msl,wind_speed_10m,wind_direction_10m'
      + ',wind_gusts_10m,relative_humidity_2m,dew_point_2m'
      + '&wind_speed_unit=ms';
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    latest = toSignalK((await res.json()).current);
    setStatus('st-wx', 'ok', 'ok');
    log('Weather updated');
  } catch (e) {
    setStatus('st-wx', latest ? 'update failed (old data)' : 'failed', 'err');
    log(`Weather error: ${e.message}`);
  }
  renderWeather();
}

// ---- Push to Signal K (WebSocket delta stream) ----

const PUSH_MS = 10 * 1000;
let ws = null;
let wsUrl = null;
let lastPush = null;

function buildDelta() {
  const now = new Date().toISOString();
  return {
    context: 'vessels.self',
    updates: [{
      source: { label: 'internet-weather', type: 'API' },
      timestamp: now,
      values: [
        { path: 'environment.outside.temperature', value: latest.temperature },
        { path: 'environment.outside.pressure', value: latest.pressure },
        { path: 'environment.wind.speedOverGround', value: latest.windSpeed },
        { path: 'environment.wind.directionTrue', value: latest.windDirection },
        { path: 'environment.wind.gust', value: latest.windGust },
        { path: 'environment.outside.humidity', value: latest.humidity },
        { path: 'environment.outside.dewPointTemperature', value: latest.dewPoint }
      ]
    }]
  };
}

function connectSignalK() {
  const cfg = saveConfig();
  const url = `ws://${cfg.host}:${cfg.port}/signalk/v1/stream?subscribe=none&token=${encodeURIComponent(auth.token)}`;
  if (ws && wsUrl !== url) {   // host/port/token changed
    ws.close();
    ws = null;
  }
  if (ws) return;              // already connecting or open
  wsUrl = url;
  setStatus('st-sk', 'connecting', 'warn');
  const sock = new WebSocket(url);
  ws = sock;
  let opened = false;
  sock.onopen = () => {
    opened = true;
    setStatus('st-sk', 'connected', 'ok');
    log('Signal K connected');
    pushWeather();
  };
  sock.onclose = () => {
    if (ws === sock) ws = null;
    if (opened) {
      setStatus('st-sk', 'disconnected (retrying)', 'warn');
      log('Signal K connection closed');
    } else {
      setStatus('st-sk', 'connection failed (retrying)', 'err');
      log('Signal K connection failed - check IP/port and token (request access again if needed)');
    }
  };
}

function pushWeather() {
  if (!latest || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(buildDelta()));
  lastPush = new Date();
  setStatus('st-sk', `connected, last push ${lastPush.toLocaleTimeString()}`, 'ok');
}

function pushTick() {
  if (!auth.token) {
    setStatus('st-sk', 'waiting for access', 'warn');
    return;
  }
  connectSignalK();
  pushWeather();
}

function init() {
  const cfg = loadConfig();
  $('host').value = cfg.host;
  $('port').value = cfg.port;
  $('host').addEventListener('change', saveConfig);
  $('port').addEventListener('change', saveConfig);
  $('btn-access').addEventListener('click', requestAccess);
  renderAuth();
  if (auth.requestHref) pollRequest();
  updateWeather();
  setInterval(updateWeather, WEATHER_MS);
  pushTick();
  setInterval(pushTick, PUSH_MS);
  log(`Ready. Signal K target: ${cfg.host}:${cfg.port}`);
}

init();
</script>
</body>
</html>
